version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sic_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sic123}
      POSTGRES_DB: ${POSTGRES_DB:-sales_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sic"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sic_backend
    env_file: .env
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: sic_frontend
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pg_data:
